services:
  postgres-test:
    image: postgres:16-alpine
    container_name: parts-postgres-test
    environment:
      POSTGRES_USER: parts_user
      POSTGRES_PASSWORD: parts_pass
      POSTGRES_DB: parts_db_test
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data: